name: Apply career update
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'chore: apply career-path update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply requested changes
        shell: python
        run: |
          from pathlib import Path
          import re

          def edit(path, replacements):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
                  s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8', newline='')

          edit('css/style.css', [
              ('''/* community link: a pill in the quiet bottom band, deliberately lighter than 開始生涯 so it\n   does not compete with the primary action, but with a real outline so it reads as tappable */\n#community{min-width:0;text-align:center;margin-top:0}\n#community a{min-height:50px;display:flex;align-items:center;justify-content:center;gap:var(--space-8);\n  border:1px solid var(--border-strong);border-radius:var(--r);padding:12px 8px;\n  color:var(--text-primary);text-decoration:none;font-size:16px;line-height:24px;font-weight:700;letter-spacing:0;transition:.15s}\n#community a .ph,#community a .ph-bold,#community a .ph-fill{width:16px;height:16px;font-size:16px}\n#community a:hover{background:var(--surface-interactive);border-color:var(--border-strong)}\n#community a:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px;box-shadow:0 0 0 1px var(--bg)}\n''', ''),
              ('''/* ---------- 贊助入口 ----------\n   首頁膠囊屬於可捲動 main + 遊戲內選單的連結按鈕，兩處導向同一個贊助頁。 */\n#sponsor-corner{align-self:flex-end;height:30px;display:inline-flex;align-items:center;gap:var(--space-4);\n  border:1px solid var(--accent-primary);border-radius:var(--radius-pill);\n  background:color-mix(in srgb,var(--accent-primary) 10%,var(--surface-default));\n  padding:4px var(--space-12);color:var(--accent-primary);text-decoration:none;\n  font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:0;line-height:20px;transition:.15s}\n#sponsor-corner .ic{width:16px;height:16px;font-size:16px;line-height:1}\n#sponsor-corner:hover,#sponsor-corner:focus-visible{border-color:var(--accent);\n  background:color-mix(in srgb,var(--accent) 20%,var(--panel));box-shadow:var(--glow)}\n/* 選單內的贊助按鈕沿用 .btn 外觀,但因為是 <a> 必須蓋掉底線與 a 的預設連結色 */\na.btn{text-decoration:none;color:var(--text)}\na.btn#md-sponsor{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--edge))}\na.btn#md-sponsor:hover,a.btn#md-sponsor:focus-visible{border-color:var(--accent)}\na.btn#md-sponsor small{color:var(--dim)}\n''', '''a.btn{text-decoration:none;color:var(--text)}\n''')
          ])

          edit('index.html', [
              ('''    <!-- 贊助入口：首頁現在屬於可捲動 main；網址同時寫在 src/config.js 的 SPONSOR_URL（遊戲內選單用），兩處要一起改。 -->\n    <a id="sponsor-corner" href="https://portaly.cc/mrthemost" target="_blank" rel="noopener noreferrer"\n       title="支持 YaKyoLife：贊助伺服器與後續開發"><i class="ph-fill ph-heart ic" aria-hidden="true"></i>贊助支持</a>\n''', ''),
              ('''      <div id="community"><a href="https://discord.gg/UnDYxFtz4U" target="_blank" rel="noopener noreferrer"><i class="ph-fill ph-chat-circle-dots" aria-hidden="true"></i>加入 Discord</a></div>\n''', ''),
              ('''    <div class="start-meta">Produced by <a href="https://www.threads.com/@mr.themost" target="_blank" rel="noopener">最先生 Mr.TheMost</a><span id="ver-badge">v1.5.11</span></div>\n''', '''    <div class="start-meta"><span id="ver-badge">v1.5.11</span></div>\n''')
          ])

          edit('src/config.js', [
              ('''/* 贊助頁：遊戲內選單用。首頁右上角的入口是 index.html 裡的靜態 <a>（不經 JS，才不會閃一下），\n   所以網址在兩個地方各寫一次，要改請兩處一起改。 */\nexport const SPONSOR_URL='https://portaly.cc/mrthemost';\r\n''', '')
          ])

          edit('src/engine/contract.js', [
              ("import {LV, PATHS, CPBL_TEAMS, NPB_TEAMS, MLB_TEAMS} from '../data/teams.js?v=1.5.11';", "import {LV, PATHS, CPBL_TEAMS, NPB_TEAMS, MLB_TEAMS, CORPORATE_TEAMS, INDEP_TEAMS} from '../data/teams.js?v=1.5.11';"),
              ('''/* 引退時若沒回中職,補一場大巨蛋開球告別 */\nexport function daibaFarewell(cont){\n  if(S.stage==='PRO'&&S.org!=='CPBL'&&!S._daiba){ S._daiba=true;\n    card('gold','最後一球',`雖然沒能回到家鄉獻技，你還是接受了邀請，回到 <b class="hl">臺北大巨蛋</b> 當一日中職球員。開球儀式上，四萬人的注視下，你投出了生涯的最後一球——不為勝負，只為那個曾經在紅土上作夢的自己。`);\n  }\n  cont();\n}''', '''/* 引退時若曾經打過中職、但退休當下人不在中職，補一場台北大巨蛋開球告別；\n   從沒踏進中職的生涯（例如純日職／純美職）就不套用這段彩蛋。 */\nexport function daibaFarewell(cont){\n  if(S.stage==='PRO'&&S.org!=='CPBL'&&S.lastCpblTeam&&!S._daiba){ S._daiba=true;\n    card('gold','最後一球',`雖然沒能在 <b class="hl">${S.lastCpblTeam}</b> 完成告別賽，台北大巨蛋還是邀你回去，當一日中職球員開球。四萬人的注視下，你投出了生涯的最後一球——不為勝負，只為那個曾經在紅土上作夢的自己。`);\n  }\n  cont();\n}'''),
              ('''        if(o>=LV.NPB1.min&&chance(Math.round(60*ageGateJP())))alts.push({t:'跳槽日職一軍',s:'旅日合約',f:()=>{buyoutRemaining();signTo('NPB','NPB1',returnTeam('NPB').team);advance();}});\n        else if(o>=LV.NPB2.min&&chance(50))alts.push({t:'轉戰日職二軍（支配下）',f:()=>{buyoutRemaining();signTo('NPB','NPB2',returnTeam('NPB').team);advance();}});\n        if(o>=LV.CPBL1.min)alts.push({t:'返台加盟中職一軍',s:'落葉歸根',f:()=>{buyoutRemaining();signTo('CPBL','CPBL1',returnTeam('CPBL').team);advance();}});\n      }else if(S.org==='NPB'&&o>=LV.CPBL1.min&&chance(70)){\n        alts.push({t:'返台加盟中職一軍',f:()=>{buyoutRemaining();signTo('CPBL','CPBL1',returnTeam('CPBL').team);advance();}});''', '''        if(o>=LV.NPB1.min&&chance(Math.round(60*ageGateJP())))alts.push({t:'跳槽日職一軍',s:'旅日合約',f:()=>{buyoutRemaining();signTo('NPB','NPB1',returnTeam('NPB').team);advance();}});\n        else if(o>=LV.NPB2.min&&chance(50))alts.push({t:'轉戰日職二軍（支配下）',f:()=>{buyoutRemaining();signTo('NPB','NPB2',returnTeam('NPB').team);advance();}});\n        else alts.push(...homecomingFallbackOptions(o,{pre:buyoutRemaining,done:advance}));\n      }'''),
              ('''  /* 遭原聯盟釋出，尋找重疊層級合約 */\n  const offers=[];\n  if(S.org!=='NPB'&&o>=44)offers.push({t:'日職二軍（支配下）合約',f:()=>{buyoutRemaining(1);signTo('NPB','NPB2',returnTeam('NPB').team);}});\n  if(S.org!=='CPBL'){ if(o>=41)offers.push({t:'中職一軍合約',f:()=>{buyoutRemaining(1);signTo('CPBL','CPBL1',returnTeam('CPBL').team);}});\n    else if(o>=30)offers.push({t:'中職二軍合約',f:()=>{buyoutRemaining(1);signTo('CPBL','CPBL2',returnTeam('CPBL').team);}}); }''', '''  /* 遭原聯盟釋出，尋找重疊層級合約 */\n  const offers=[];\n  if(S.org!=='NPB'&&o>=44)offers.push({t:'日職二軍（支配下）合約',f:()=>{buyoutRemaining(1);signTo('NPB','NPB2',returnTeam('NPB').team);}});\n  offers.push(...homecomingFallbackOptions(o,{pre:()=>buyoutRemaining(1)}));'''),
              ('''/* 多隊報價選擇:opts=[{team,bonus,yrs,mult,lv}] */''', '''/* ---------- 日職路走不通時的其他出路 ----------\n   日本出身球員的預設順位是先設法回日職；只有在日職沒人要時，才輪到這裡：\n   社會人／獨立聯盟是留在日本國內的路，中職洋將則是跨海挑戰。\n   三個選項各自用 chance() 模擬「球團願不願意開價」，門檻不到或運氣不好就不會出現，\n   全部落空時呼叫端要自己準備「留在原地」或「引退」的收尾。 */\nexport function homecomingFallbackOptions(o,cfg){\n  const pre=(cfg&&cfg.pre)||null, done=(cfg&&cfg.done)||null;\n  const run=fn=>{ if(pre)pre(); fn(); if(done)done(); };\n  const opts=[];\n  if(o>=LV.CORP.min&&chance(75))opts.push({t:'加入社會人球隊',s:'職棒沒有位置，社會人球隊向你招手',f:()=>run(()=>{\n    const team=pick(CORPORATE_TEAMS);\n    S.org='CORP'; S.lv='CORP'; S.orgTeam=team; S.team=team; S.svc=0; S.faElig=false;\n    S.ct=makeContract(1,1,'CORP',0,48,null,'業餘球團合約');\n    card('info','加盟社會人',`職業球團都沒有留位置給你，社會人球隊卻向你伸出手——你決定加入 <b class="hl">${team}</b>，在企業隊延續棒球生涯。`); board(2);\n  })});\n  if(o>=LV.INDEP.min&&chance(80))opts.push({t:'加入獨立聯盟',s:'獨立聯盟球隊願意給你舞台',f:()=>run(()=>{\n    const team=pick(INDEP_TEAMS);\n    S.org='INDEP'; S.lv='INDEP'; S.orgTeam=team; S.team=team; S.svc=0; S.faElig=false;\n    S.ct=makeContract(1,1,'INDEP',0,36,null,'業餘球團合約');\n    card('info','加盟獨立聯盟',`沒有職棒球團開價，獨立聯盟球隊卻願意給你舞台——你決定加入 <b class="hl">${team}</b>，繼續留在球場上。`); board(2);\n  })});\n  if(o>=LV.CPBL1.min&&chance(60))opts.push({t:'挑戰中職洋將名額',s:'台灣中華職棒開出洋將合約',f:()=>run(()=>{\n    const dest=returnTeam('CPBL');\n    signTo('CPBL','CPBL1',dest.team,ri(1,2),1,undefined,true);\n    card('info','海外挑戰',`台灣中華職棒的 <b class="hl">${dest.team}</b> 開出洋將合約，邀你跨海挑戰——你把握這個機會，前進台灣職棒。`); board(2);\n  })});\n  return opts;\n}\n/* 多隊報價選擇:opts=[{team,bonus,yrs,mult,lv}] */'''),
              ('''  /* 5b 旅外球員合約到期:多一個返台加盟中職的選項(落葉歸根) */\n  if(S.org!=='CPBL'&&o>=LV.CPBL1.min){\n    faOpts.push({t:'返台加盟中職一軍',s:'落葉歸根，回到熟悉的主場',\n      f:()=>{ returnHomeSign(S.org,'CPBL','CPBL1',\n        `結束海外的挑戰，你把行李箱從衣櫃頂端搬了下來。護照上那些出入境章記錄了你走過的地方，但這一次，飛機降落的是熟悉的桃園機場。你決定回到家鄉球迷面前，把剩下的棒球打完。`);\n        advance(); }});\n  }''', '''  /* 5b 日職路走不通時，海外／國內的其他出路（社會人／獨立聯盟／中職洋將） */\n  if(S.org!=='CPBL')faOpts.push(...homecomingFallbackOptions(o,{done:advance}));'''),
              ('''export function homecomingAfterRejectedOffer(o){\n  const homeLv=o>=LV.CPBL1.min?'CPBL1':'CPBL2';\n  /* 先擲好去哪一隊,按鈕才寫得出隊名——90% 回母隊,10% 談不攏改投他隊(見 returnTeam)。 */\n  const dest=returnTeam('CPBL');\n  const annual=calcContractAnnual(homeLv,marketRating(S.lastD||0,homeLv),1);\n  const from=S.org;\n  choose(`落葉歸根 · 球團評估從${LV[homeLv].n}出發`,[\n    {t:`返台加盟 ${dest.team}（${LV[homeLv].n}）`,main:true,\n      s:`綜合 ${o}｜一軍門檻 ${LV.CPBL1.min}｜固定年薪 ${fmtMoney(annual)} × 1 年`,f:()=>{\n        returnHomeSign(from,'CPBL',homeLv,\n          `你婉拒了海外的合約，把球具收一收，決定回到出發的地方，從 <b class="hl">${LV[homeLv].n}</b>重新開始。`,\n          {dest,yrs:1,mult:1,annual});\n        advance(); }},\n    {t:'就此引退',warn:true,s:'不再簽下新合約，結束球員生涯',f:retireFromMarket}\n  ]);\n}''', '''export function homecomingAfterRejectedOffer(o){\n  const opts=homecomingFallbackOptions(o,{done:advance});\n  opts.push({t:'就此引退',warn:true,s:'不再簽下新合約，結束球員生涯',f:retireFromMarket});\n  choose(`何去何從 · 婉拒報價後，綜合能力 ${o}`,opts);\n}'''),
              ('''        },org==='CPBL'?'拒絕合約，宣布引退':'落葉歸根',org==='CPBL'?'不接受這份合約，直接結束球員生涯':'婉拒這份合約，查看返台層級或選擇引退',of.mult||1,false); }}));''', '''        },org==='CPBL'?'拒絕合約，宣布引退':'婉拒，另尋出路',org==='CPBL'?'不接受這份合約，直接結束球員生涯':'婉拒這份合約，看看還有沒有其他球隊願意開價',of.mult||1,false); }}));''')
          ])

          edit('src/flow/phases.js', [
              ("import {buyoutRemaining, contractAnnual, contractMarketProfile, controlledAnnual, crossOffers, daibaFarewell, extensionOffer, faFlow, fmtMoney, handleDemotion, levelMinAnnual, makeContract, makeOffers, offseasonTradeCheck, pickOfferUI, signTo, teamChampRate} from '../engine/contract.js?v=1.5.11';", "import {ageGateJP, buyoutRemaining, contractAnnual, contractMarketProfile, controlledAnnual, crossOffers, daibaFarewell, extensionOffer, faFlow, fmtMoney, handleDemotion, homecomingFallbackOptions, levelMinAnnual, makeContract, makeOffers, offseasonTradeCheck, pickOfferUI, returnTeam, signTo, teamChampRate} from '../engine/contract.js?v=1.5.11';"),
              ('''    /* 旅外老將(衰退期):放棄現有合約,落葉歸根返台;ovr<30(真的打不動)不給 */\n    if(S.org!=='CPBL'&&ovr()>=LV.CPBL2.min){\n      oldOpts.push({t:'放棄合約，落葉歸根',s:'狀態不再，仍想把最後的球打給家鄉看',f:()=>{\n        card('good','落葉歸根',`狀態雖然已經不在巔峰，但家鄉球隊仍然向你招手——他們要的不是你的實力，是你在國際賽、在海外聯賽建立起的回憶。你決定放棄合約，回家，把職業生涯最後幾年奉獻給大家。`);\n        signTo('CPBL','CPBL1'); tlRestage(); afterAsk(); /* spring move: this season is already CPBL */\n      }});\n    }''', '''    /* 旅美老將(衰退期):放棄現有合約，設法回日本打最後幾年；日職沒人要，再考慮其他出路。\n       身在日職的老將已經在家鄉，不套用這條——直接引退或再戰一年就好。 */\n    if(S.org==='MiLB'){\n      const o=ovr();\n      if(o>=LV.INDEP.min){\n        oldOpts.push({t:'放棄合約，設法回日本',s:'想把職業生涯最後幾年留給日本球迷',f:()=>{\n          if(o>=LV.NPB1.min&&chance(Math.round(50*ageGateJP()))){\n            signTo('NPB','NPB1',returnTeam('NPB').team);\n            card('good','回到日本',`狀態雖然已經不在巔峰，但日職球團看重的是你在海外累積的經驗與名氣——你決定放棄合約，回到日本，把職業生涯最後幾年留給球迷。`);\n            tlRestage(); afterAsk();\n          }else if(o>=LV.NPB2.min&&chance(45)){\n            signTo('NPB','NPB2',returnTeam('NPB').team);\n            card('good','回到日本',`一軍球團暫時沒有位置，但二軍球隊願意給你舞台——你決定放棄合約，回到日本，從支配下球員重新出發。`);\n            tlRestage(); afterAsk();\n          }else{\n            const opts=homecomingFallbackOptions(o,{done:()=>{tlRestage();afterAsk();}});\n            if(opts.length){\n              card('info','日職沒有回音','你試著聯繫日本職棒球團，但沒有球隊願意開價——所幸還有其他邀約。');\n              choose('還有其他選擇',opts);\n            }else{\n              card('bad','四處碰壁','日職球團沒有回應，其他聯盟也沒有球隊聯繫你，只能繼續留在原地。');\n              afterAsk();\n            }\n          }\n        }});\n      }\n    }'''),
              ('''export function annualHomecomingEligible(org,lv){\n  return (org==='MiLB'&&!!LV[lv]&&!LV[lv].top)||(org==='NPB'&&lv==='NPB2');\n}''', '''export function annualHomecomingEligible(org,lv){\n  /* 只有旅美（小聯盟）才談得上「回不回得去日本」；日職二軍本來就在日本國內，\n     不該每季都跳出「返台」選項。 */\n  return org==='MiLB'&&!!LV[lv]&&!LV[lv].top;\n}'''),
              ('''  /* 仍在海外養成層級時，每個球季結束都讓玩家重新決定是否返台。\n     日職二軍與小聯盟相同，不因身處支配下體系就鎖死去向。 */\n  if(annualHomecomingEligible(S.org,S.lv)){\n    const homeLv=o>=LV.CPBL1.min?'CPBL1':'CPBL2';\n    const inJapan=S.org==='NPB';\n    choose(inJapan?'旅日生涯抉擇':'旅美生涯抉擇',[\n      {t:inJapan?'繼續挑戰日職':'繼續挑戰小聯盟',main:true,\n       s:inJapan?`留在${LV[S.lv].n}，繼續爭取升上一軍`:`留在${LV[S.lv].n}，繼續朝大聯盟前進`,f:()=>crossOffers(o)},\n      {t:`返台加盟中職（${LV[homeLv].n}）`,s:`結束${inJapan?'旅日':'小聯盟'}挑戰，回到台灣延續職業生涯`,f:()=>{\n        signTo('CPBL',homeLv);\n        card('good','返鄉',`你決定結束${inJapan?'旅日':'旅美'}挑戰，回到台灣，從<b class="hl">${LV[homeLv].n}</b>延續職業生涯。`);\n        advance();\n      }}\n    ]);\n    return;\n  }''', '''  /* 仍在小聯盟養成層級時，每個球季結束都讓玩家重新決定要不要試著回日本。\n     順位固定：先設法回日職，日職沒人要才輪到社會人／獨立聯盟／中職洋將；\n     四處碰壁的話就只能繼續留在小聯盟拚下去，不會被強制引退。 */\n  if(annualHomecomingEligible(S.org,S.lv)){\n    const tryJapan=()=>{\n      if(o>=LV.NPB1.min&&chance(Math.round(50*ageGateJP()))){\n        signTo('NPB','NPB1',returnTeam('NPB').team);\n        card('gold','轉戰日職一軍',`你決定結束小聯盟的挑戰，帶著累積的經驗回到日本，挑戰日職一軍。`); advance(); return true;\n      }\n      if(o>=LV.NPB2.min&&chance(45)){\n        signTo('NPB','NPB2',returnTeam('NPB').team);\n        card('info','轉戰日職二軍',`你決定結束小聯盟的挑戰，回到日本，從日職二軍的支配下球員重新出發。`); advance(); return true;\n      }\n      return false;\n    };\n    choose('旅美生涯抉擇',[\n      {t:'繼續挑戰小聯盟',main:true,s:`留在${LV[S.lv].n}，繼續朝大聯盟前進`,f:()=>crossOffers(o)},\n      {t:'考慮回日本發展',s:'先設法談日職合約，若無人問津再考慮其他出路',f:()=>{\n        if(tryJapan())return;\n        const opts=homecomingFallbackOptions(o,{done:advance});\n        if(opts.length){\n          card('info','日職沒有回音','你試著聯繫日本職棒球團，但沒有球隊願意開出合約——所幸還有其他邀約。');\n          choose('還有其他選擇',opts);\n        }else{\n          card('bad','四處碰壁','日職球團沒有回應，其他聯盟也沒有球隊聯繫你。看來，你只能繼續留在小聯盟拚下去。');\n          crossOffers(o);\n        }\n      }}\n    ]);\n    return;\n  }''')
          ])

