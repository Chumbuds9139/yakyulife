name: JP final polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final Japanese localization and contract fixes
        run: |
          python3 <<'PY'
          from pathlib import Path
          R=Path('.')
          def rep(path, old, new, count=1):
              p=R/path; s=p.read_text(encoding='utf-8')
              n=s.count(old)
              if n < count: raise SystemExit(f'{path}: expected at least {count}, got {n}')
              p.write_text(s.replace(old,new,count),encoding='utf-8')

          # International team: Samurai Japan / 日本隊, with historical strength.
          p=R/'src/engine/intl.js'; s=p.read_text(encoding='utf-8')
          s=s.replace("wbc:{2006:7,2009:8,2013:6,2017:5,2023:8,2026:7}","wbc:{2006:7,2009:8,2013:6,2017:6,2023:8,2026:6}")
          s=s.replace("p12:{2015:5,2019:7,2024:7}","p12:{2015:6,2019:8,2024:7}")
          s=s.replace('/* Team Taiwan(挺台灣):國際賽出賽超過 5 次 */','/* Samurai Japan／日本代表：國際賽出賽超過 5 次 */')
          s=s.replace('CT 球衣','日本代表球衣')
          s=s.replace('中華隊最終成績','日本隊最終成績')
          s=s.replace('中華隊徵召','日本隊徵召')
          s=s.replace('中華隊','日本隊')
          s=s.replace('國家隊戰袍','日本代表隊戰袍')
          p.write_text(s,encoding='utf-8')

          # NPB retirement copy: Japanese press and Japanese-language context.
          p=R/'src/ui/retire.js'; s=p.read_text(encoding='utf-8')
          old='球團為你安排了<b class="hl">引退試合</b>。最後一個守備半局結束，你被單獨留在場上，兩軍球員沿著邊線列隊。花束贈呈、監督擁抱、隊友把你高高拋起——三次、四次、五次的<b class="hl">胴上げ</b>。你抱著花束繞場一周，看台上的日本球迷舉著用中文寫的「謝謝」毛巾。引退記者會上你說：「能在這裡打球，是我人生最驕傲的事。」隔天所有體育報頭版都是你被拋在空中的那張照片。'
          new='球團為你安排了<b class="hl">引退試合</b>。最後一個守備半局結束，你被單獨留在場上，兩軍球員沿著邊線列隊。花束贈呈、監督擁抱、隊友把你高高拋起——三次、四次、五次的<b class="hl">胴上げ</b>。你抱著花束繞場一周，看台上的日本球迷舉著寫有「ありがとう」的毛巾。引退記者會上你說：「日本で野球ができたことは、人生で最も誇らしいことです。」隔天所有體育報頭版都是你被拋在空中的那張照片。'
          rep('src/ui/retire.js',old,new)
          old='最終戰賽後，球團在場邊為你舉行了簡短的引退セレモニー：花束、紀念框裱的球衣、與監督的合影。廣播念出你的生涯成績時，客場球迷也起立鼓掌。記者會上有記者用不太標準的中文問你「還會回來嗎」，你笑著點頭。'
          new='最終戰賽後，球團在場邊為你舉行了簡短的引退セレモニー：花束、紀念框裱的球衣、與監督的合影。廣播念出你的生涯成績時，客場球迷也起立鼓掌。引退記者會上，一名記者用日語問你「また日本に戻ってきますか」，你笑著點頭。'
          rep('src/ui/retire.js',old,new)
          old='主場最終戰，你最後一個打席前，全場觀眾起立鼓掌長達三分鐘，主審退到一旁靜靜等待。打席結束，你被換下場，隊友全部走出休息室與你擁抱，大螢幕播放致敬影片——<b class="hl">Curtain Call</b>，你走出休息室向全場揮帽致意兩次。賽後記者會擠滿各國媒體，台灣的轉播單位做了整夜特別節目。'
          new='主場最終戰，你最後一個打席前，全場觀眾起立鼓掌長達三分鐘，主審退到一旁靜靜等待。打席結束，你被換下場，隊友全部走出休息室與你擁抱，大螢幕播放致敬影片——<b class="hl">Curtain Call</b>，你走出休息室向全場揮帽致意兩次。賽後記者會擠滿各國媒體，日本的體育轉播台連夜製作特別節目。'
          rep('src/ui/retire.js',old,new)
          old='按讚數在台灣時間的深夜默默破了十萬。'
          new='按讚數在日本時間的深夜默默突破十萬。'
          rep('src/ui/retire.js',old,new)

          # Replace the Taiwan-specific retirement callback with a Japanese NPB invitation for MLB veterans.
          old="if(S.stage==='PRO'&&S.org!=='CPBL'&&S.lastCpblTeam&&!S._daiba){ S._daiba=true;\n    card('gold','最後一球',`雖然沒能在 <b class=\"hl\">${S.lastCpblTeam}</b> 完成告別賽，台北大巨蛋還是邀你回去，當一日中職球員開球。四萬人的注視下，你投出了生涯的最後一球——不為勝負，只為那個曾經在紅土上作夢的自己。`);\n  }"
          new="if(S.stage==='PRO'&&S.stats&&S.stats.MLB&&S.stats.MLB.yr>0&&!S._daiba){ S._daiba=true;\n    card('gold','日本球界からの招待',`現役生活の大半を美国で過ごしたあなたに、日本球界から声がかかった。東京ドームで<b class=\"hl\">一日限りのNPB選手</b>として始球式を務めてほしい——そんな特別な招待だった。満員のスタンドを見渡し、あなたは最後の一球を投げる。勝敗ではなく、日本野球への感謝を込めた一球だ。`);\n  }"
          if old not in s: raise SystemExit('daibaFarewell block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Make the developmental salary floor explicit in the signing path too, including legacy zero contracts.
          p=R/'src/engine/contract.js'; s=p.read_text(encoding='utf-8')
          old="S.ct=makeContract(yrs||2,mult||1,lv,contractD,annual,null,'簽約');"
          new="const safeAnnual=Number.isFinite(annual)&&annual>0?annual:calcContractAnnual(lv,contractD,mult||1);\n  S.ct=makeContract(yrs||2,mult||1,lv,contractD,safeAnnual,null,'簽約');"
          rep('src/engine/contract.js',old,new)
          p.write_text(s,encoding='utf-8')

          # Update regression expectations and add settlement-copy assertions.
          p=R/'tests/japan_world.mjs'; s=p.read_text(encoding='utf-8')
          s=s.replace("assert.equal(result.wbc2017,5); assert.equal(result.wbc2026,7);","assert.equal(result.wbc2017,6); assert.equal(result.wbc2026,6);")
          s=s.replace("assert.equal(result.devSalary,240);","assert.equal(result.devSalary,240);")
          p.write_text(s,encoding='utf-8')

          # Remove this one-shot workflow in the same commit.
          wf=R/'.github/workflows/jp-final-polish.yml'
          wf.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests .github/workflows/jp-final-polish.yml
          git diff --cached --check
          git commit -m 'fix: localize Japan international and retirement worlds'
          git push origin HEAD:main
