name: Import upstream two-way system

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: ${{ !contains(github.event.head_commit.message, '[twoway-import]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "twoway-import-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/LeoGGcat/yakyulife.git
          git fetch upstream main
      - name: Build a clean upstream two-way branch
        run: |
          set -e
          git switch --detach 18c5bf257f46489595efcab7b6a8ebf0da7e4ccf
          git cherry-pick feebc6cbec91fe665f9b334294ec13b0dab23d9b
          git cherry-pick 33c4cf48bc16ae64fcec8cafac6e8014829c5301 || {
            git rm -f docs/twoway-design.md
            git cherry-pick --continue
          }
          git cherry-pick c601cae77f25ae517639aa1d255a7cd44b895b25 || {
            git rm -f docs/twoway-design.md
            git cherry-pick --continue
          }
          git branch -f twoway-upstream HEAD
          git switch main
      - name: Merge only the two-way phase 1 and 2 changes
        run: |
          set -e
          git merge --no-ff --no-edit -X ours twoway-upstream
      - name: Syntax check
        run: |
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --experimental-default-type=module --check
      - name: Commit merged result
        run: |
          git status --short
          git commit --allow-empty -m "[twoway-import] import two-way phase 1 and 2"
          git push origin HEAD:main
