name: JP final polish 2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final fixes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          R=Path('.')
          def rep(path, old, new, count=1):
              p=R/path; s=p.read_text(encoding='utf-8'); n=s.count(old)
              if n < count: raise SystemExit(f'{path}: expected {count}, got {n}')
              p.write_text(s.replace(old,new,count),encoding='utf-8')

          # Japan national team naming and historical strength.
          p=R/'src/engine/intl.js'; s=p.read_text(encoding='utf-8')
          s=s.replace('wbc:{2006:7,2009:8,2013:6,2017:5,2023:8,2026:7}','wbc:{2006:7,2009:8,2013:6,2017:6,2023:8,2026:6}')
          s=s.replace('p12:{2015:5,2019:7,2024:7}','p12:{2015:6,2019:8,2024:7}')
          for a,b in [('中華隊徵召','日本隊徵召'),('中華隊最終成績','日本隊最終成績'),('中華隊','日本隊'),('CT 球衣','日本代表球衣'),('國家隊戰袍','日本代表隊戰袍')]: s=s.replace(a,b)
          s=s.replace('Team Taiwan(挺台灣)','Samurai Japan／日本代表')
          p.write_text(s,encoding='utf-8')

          # Retirement copy: NPB should feel Japanese, MLB should not default to Taiwan.
          p=R/'src/ui/retire.js'; s=p.read_text(encoding='utf-8')
          s=s.replace('用中文寫的「謝謝」毛巾','寫有「ありがとう」的毛巾')
          s=s.replace('記者會上你說：「能在這裡打球，是我人生最驕傲的事。」','引退記者會上你說：「日本で野球ができたことは、人生で最も誇らしいことです。」')
          s=s.replace('記者會上有記者用不太標準的中文問你「還會回來嗎」，你笑著點頭。','引退記者會上，一名記者用日語問你「また日本に戻ってきますか」，你笑著點頭。')
          s=s.replace('台灣的轉播單位做了整夜特別節目','日本的體育轉播台連夜製作特別節目')
          s=s.replace('按讚數在台灣時間的深夜默默破了十萬','按讚數在日本時間的深夜默默突破十萬')
          p.write_text(s,encoding='utf-8')

          # MLB veteran retirement invitation: Tokyo Dome / one-day NPB player, not Taipei/CPBL.
          p=R/'src/engine/contract.js'; s=p.read_text(encoding='utf-8')
          pat=r"export function daibaFarewell\(cont\)\{.*?\n\}\n"
          new="""export function daibaFarewell(cont){
  if(S.stage==='PRO'&&S.stats&&S.stats.MLB&&S.stats.MLB.yr>0&&!S._daiba){ S._daiba=true;
    card('gold','日本球界からの招待',`現役生活の大半を美国で過ごしたあなたに、日本球界から声がかかった。東京ドームで<b class=\"hl\">一日限りのNPB選手</b>として始球式を務めてほしい——そんな特別な招待だった。満員のスタンドを見渡し、あなたは最後の一球を投げる。勝敗ではなく、日本野球への感謝を込めた一球だ。`);
  }
  cont();
}
"""
          s2,n=re.subn(pat,new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('daibaFarewell function not found')
          p.write_text(s2,encoding='utf-8')

          # Developmental salary: NPB育成 is never allowed to carry a zero annual salary.
          p=R/'src/engine/contract.js'; s=p.read_text(encoding='utf-8')
          old="S.ct=makeContract(yrs||2,mult||1,lv,contractD,annual,null,'簽約');"
          new="const safeAnnual=Number.isFinite(annual)&&annual>0?annual:calcContractAnnual(lv,contractD,mult||1);\n  S.ct=makeContract(yrs||2,mult||1,lv,contractD,safeAnnual,null,'簽約');"
          if old in s: s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Regression expectations reflect actual 2026 Japan WBC quarterfinal result.
          p=R/'tests/japan_world.mjs'; s=p.read_text(encoding='utf-8')
          s=s.replace('assert.equal(result.wbc2017,5); assert.equal(result.wbc2026,7);','assert.equal(result.wbc2017,6); assert.equal(result.wbc2026,6);')
          p.write_text(s,encoding='utf-8')

          # Syntax check every JS module before committing.
          import subprocess
          js=list(R.glob('src/**/*.js'))
          for f in js:
              subprocess.run(['node','--check',str(f)],check=True)

          wf=R/'.github/workflows/jp-final-polish-2.yml'; wf.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests .github/workflows/jp-final-polish-2.yml
          git diff --cached --check
          git commit -m 'fix: finish Japanese world localization'
          git push origin HEAD:main
