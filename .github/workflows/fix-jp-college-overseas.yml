name: One-shot college overseas repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore college MLB offer calculation
        run: |
          python3 .github/fix-jp-college-overseas.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/flow/phases.js
          git commit -m "fix: restore college MLB overseas route"
          git push origin HEAD:main
      - name: Remove one-shot files
        run: |
          git rm .github/fix-jp-college-overseas.py .github/workflows/fix-jp-college-overseas.yml
          git commit -m "chore: remove one-shot college overseas repair"
          git push origin HEAD:main
