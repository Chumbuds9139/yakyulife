# 部署到 GitHub Pages
name: Deploy Pages

on:
  push:
    branches: [main, japan-branch-v1]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: 回歸測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 檢查所有 JavaScript 語法
        run: find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: 安裝 Playwright 與 Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: 起本機伺服器並定位瀏覽器 parser 錯誤
        run: |
          python3 -m http.server 8124 --bind 127.0.0.1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8124/ >/dev/null && break; sleep 0.5; done
          CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          export CHROME_PATH
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--disable-gpu']});
            const page=await browser.newPage();
            await page.goto('http://127.0.0.1:8124/probe.html').catch(()=>{});
            const src=await page.evaluate(()=>fetch('/src/ui/dom.js?v=1.5.11').then(r=>r.text()));
            const stripped=src.replace(/^\s*import[\\s\\S]*?;\s*$/gm,'').replace(/^\s*export\s+/gm,'');
            try{ new Function(stripped); console.log('DOM_SCRIPT_PARSE_OK'); }
            catch(error){ console.log('DOM_SCRIPT_PARSE_ERROR',error.message,error.stack||''); process.exitCode=1; }
            const out=[];
            for(const mod of ['./src/ui/dom.js?v=1.5.11','./src/engine/season.js?v=1.5.11','./src/engine/contract.js?v=1.5.11']){
              try{await import(mod);out.push({mod,ok:true});}catch(error){out.push({mod,ok:false,message:error.message,stack:error.stack});}
            }
            console.log(JSON.stringify(out,null,2));
            await browser.close();
            if(out.some(x=>!x.ok))process.exitCode=1;
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
      - name: 起本機伺服器並跑 tests/
        run: |
          python3 -m http.server 8124 --bind 127.0.0.1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8124/ >/dev/null && break; sleep 0.5; done
          fail=0
          for f in tests/*.mjs; do
            if node "$f" >/tmp/out.txt 2>&1; then echo "PASS  $f"; else echo "FAIL  $f"; sed 's/^/        /' /tmp/out.txt | head -20; fail=1; fi
          done
          exit $fail

  deploy:
    name: 部署
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: 確保部署的是最新 main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: 組出要上線的檔案
        run: |
          mkdir -p _site
          tar -cf - --exclude=./.git --exclude=./.github --exclude=./tests --exclude=./docs --exclude=./node_modules --exclude=./_site --exclude=./CNAME . | tar -xf - -C _site
          test -f _site/index.html || { echo "✗ index.html 不見了，中止部署"; exit 1; }
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
