# 部署到 GitHub Pages
#
# 日本版開發分支也跑同一套回歸測試，但正式部署仍只在 main。
name: Deploy Pages

on:
  push:
    branches: [main, japan-branch-v1]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: 回歸測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 套用這次指定的程式修改
        if: hashFiles('.github/apply-career-update.py') != ''
        run: |
          python3 .github/apply-career-update.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/apply-career-update.py .github/apply-career-update.trigger
          git add css/style.css index.html src/config.js src/engine/contract.js src/flow/phases.js src/ui/dom.js
          git add .github/workflows/pages.yml
          git commit -m "調整旅外生涯去向與移除贊助入口"
          git push origin HEAD:main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安裝 Playwright 與 Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: 起本機伺服器並跑 tests/
        run: |
          python3 -m http.server 8124 --bind 127.0.0.1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8124/ >/dev/null && break
            sleep 0.5
          done
          CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          export CHROME_PATH
          echo "Chromium: $CHROME_PATH"
          fail=0
          for f in tests/*.mjs; do
            if node "$f" >/tmp/out.txt 2>&1; then
              echo "PASS  $f"
            else
              echo "FAIL  $f"
              sed 's/^/        /' /tmp/out.txt | head -20
              fail=1
            fi
          done
          exit $fail

  deploy:
    name: 部署
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 確保部署的是最新 main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: 組出要上線的檔案
        run: |
          mkdir -p _site
          tar -cf - \
            --exclude=./.git --exclude=./.github --exclude=./tests \
            --exclude=./docs --exclude=./node_modules --exclude=./_site \
            --exclude=./CNAME \
            . | tar -xf - -C _site
          test -f _site/index.html || { echo "✗ index.html 不見了，中止部署"; exit 1; }
          echo "將上線的頂層項目："
          ls -1 _site

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
