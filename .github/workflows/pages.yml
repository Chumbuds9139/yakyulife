# 部署到 GitHub Pages
# final-JP-trigger-3
name: Deploy Pages

on:
  push:
    branches: [main, japan-branch-v1]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: 回歸測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 一次性套用最終日本化修正
        if: startsWith(github.event.head_commit.message, 'chore: apply final JP fixes')
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          R=Path('.')
          p=R/'src/engine/intl.js'; s=p.read_text(encoding='utf-8')
          s=s.replace('wbc:{2006:7,2009:8,2013:6,2017:5,2023:8,2026:7}','wbc:{2006:7,2009:8,2013:6,2017:6,2023:8,2026:6}')
          s=s.replace('p12:{2015:5,2019:7,2024:7}','p12:{2015:6,2019:8,2024:7}')
          for a,b in [('中華隊徵召','日本隊徵召'),('中華隊最終成績','日本隊最終成績'),('中華隊','日本隊'),('CT 球衣','日本代表球衣'),('國家隊戰袍','日本代表隊戰袍')]: s=s.replace(a,b)
          s=s.replace('Team Taiwan(挺台灣)','Samurai Japan／日本代表')
          p.write_text(s,encoding='utf-8')
          p=R/'src/ui/retire.js'; s=p.read_text(encoding='utf-8')
          s=s.replace('用中文寫的「謝謝」毛巾','寫有「ありがとう」的毛巾')
          s=s.replace('記者會上你說：「能在這裡打球，是我人生最驕傲的事。」','引退記者會上你說：「日本で野球ができたことは、人生で最も誇らしいことです。」')
          s=s.replace('記者會上有記者用不太標準的中文問你「還會回來嗎」，你笑著點頭。','引退記者會上，一名記者用日語問你「また日本に戻ってきますか」，你笑著點頭。')
          s=s.replace('台灣的轉播單位做了整夜特別節目','日本的體育轉播台連夜製作特別節目')
          s=s.replace('按讚數在台灣時間的深夜默默破了十萬','按讚數在日本時間的深夜默默突破十萬')
          p.write_text(s,encoding='utf-8')
          p=R/'src/engine/contract.js'; s=p.read_text(encoding='utf-8')
          pat=r"export function daibaFarewell\(cont\)\{.*?\n\}\n"
          new="""export function daibaFarewell(cont){
  if(S.stage==='PRO'&&S.stats&&S.stats.MLB&&S.stats.MLB.yr>0&&!S._daiba){ S._daiba=true;
    card('gold','日本球界からの招待',`現役生活の大半を美国で過ごしたあなたに、日本球界から声がかかった。東京ドームで<b class=\"hl\">一日限りのNPB選手</b>として始球式を務めてほしい——そんな特別な招待だった。満員のスタンドを見渡し、あなたは最後の一球を投げる。勝敗ではなく、日本野球への感謝を込めた一球だ。`);
  }
  cont();
}
"""
          s,n=re.subn(pat,new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('daibaFarewell not found')
          old="S.ct=makeContract(yrs||2,mult||1,lv,contractD,annual,null,'簽約');"
          if old in s: s=s.replace(old,"const safeAnnual=Number.isFinite(annual)&&annual>0?annual:calcContractAnnual(lv,contractD,mult||1);\n  S.ct=makeContract(yrs||2,mult||1,lv,contractD,safeAnnual,null,'簽約');",1)
          p.write_text(s,encoding='utf-8')
          p=R/'tests/japan_world.mjs'; s=p.read_text(encoding='utf-8')
          s=s.replace('assert.equal(result.wbc2017,5); assert.equal(result.wbc2026,7);','assert.equal(result.wbc2017,6); assert.equal(result.wbc2026,6);')
          p.write_text(s,encoding='utf-8')
          PY
          node --check src/engine/intl.js
          node --check src/engine/contract.js
          node --check src/ui/retire.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git diff --cached --check
          git commit -m 'fix: finish Japanese world localization'
          git push origin HEAD:main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 檢查所有 JavaScript 語法
        run: |
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --experimental-default-type=module --check
      - name: 安裝 Playwright 與 Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: 起本機伺服器並跑 tests/
        run: |
          python3 -m http.server 8124 --bind 127.0.0.1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8124/ >/dev/null && break; sleep 0.5; done
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          echo "Chromium: $CHROME_PATH"
          fail=0
          for f in tests/*.mjs; do
            if node "$f" >/tmp/out.txt 2>&1; then echo "PASS  $f"; else echo "FAIL  $f"; sed 's/^/        /' /tmp/out.txt | head -20; fail=1; fi
          done
          exit $fail

  deploy:
    name: 部署
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: 確保部署的是最新 main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: 組出要上線的檔案
        run: |
          mkdir -p _site
          tar -cf - --exclude=./.git --exclude=./.github --exclude=./tests --exclude=./docs --exclude=./node_modules --exclude=./_site --exclude=./CNAME . | tar -xf - -C _site
          test -f _site/index.html || { echo "✗ index.html 不見了，中止部署"; exit 1; }
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
