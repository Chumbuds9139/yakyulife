name: JP world localization pass

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply controlled Japanese world fixes
        run: |
          python3 <<'PY'
          from pathlib import Path
          ROOT=Path('.')

          def replace_once(path, old, new):
              p=ROOT/path; s=p.read_text(encoding='utf-8')
              if s.count(old)!=1: raise SystemExit(f'{path}: expected one match, got {s.count(old)}')
              p.write_text(s.replace(old,new),encoding='utf-8')

          # NPB育成: contract floor must not be 0.
          replace_once('src/data/economy.js',
              'export const LEVEL_MIN_ANNUAL={CPBL2:84,CPBL1:100,NPB2:240,NPB1:320,R:60,A1:95,A2:105,A3:125,MLB:2400};',
              'export const LEVEL_MIN_ANNUAL={CPBL2:84,CPBL1:100,NPB_TRAIN:240,NPB2:240,NPB1:320,R:60,A1:95,A2:105,A3:125,MLB:2400};')

          # Rename Team Taiwan -> internal samurai; keep legacy-save migration.
          for p in ROOT.glob('src/**/*.js'):
              s=p.read_text(encoding='utf-8')
              if 'taiwan' in s: p.write_text(s.replace('taiwan','samurai'),encoding='utf-8')
          replace_once('src/core/state.js',
              'export function setS(v){ S=bindLevelOrg(v); }',
              "export function setS(v){\n  if(v&&v.traits&&v.traits.taiwan&&!v.traits.samurai)v.traits.samurai=true;\n  if(v&&v.traits)delete v.traits.taiwan;\n  S=bindLevelOrg(v);\n}")
          replace_once('src/core/state.js',
              'role:pos===\'P\'?null:null,age:16,year:2026,stage:\'HS\',stageYr:1,pot,',
              'role:pos===\'P\'?null:null,perfectLock:false,age:16,year:2026,stage:\'HS\',stageYr:1,pot,')

          # Japan international team: historical strength affects the result roll.
          intl=ROOT/'src/engine/intl.js'; s=intl.read_text(encoding='utf-8')
          strength='''const JAPAN_INTL_STRENGTH={\n  wbc:{2006:7,2009:8,2013:6,2017:5,2023:8,2026:7},\n  p12:{2015:5,2019:7,2024:7}\n};\nexport function japanIntlStrength(year,wbc){\n  const table=wbc?JAPAN_INTL_STRENGTH.wbc:JAPAN_INTL_STRENGTH.p12;\n  if(table[year]!=null)return table[year];\n  const ys=Object.keys(table).map(Number).filter(y=>y<year).sort((a,b)=>a-b);\n  return ys.length?table[ys[ys.length-1]]:6;\n}\n'''
          if s.count('export function maybeIntl(done){')!=1: raise SystemExit('intl anchor mismatch')
          s=s.replace('export function maybeIntl(done){',strength+'export function maybeIntl(done){',1)
          old='const b=clamp(Math.round((ovr()-52)*0.35),0,8);'
          new='const teamStrength=japanIntlStrength(S.year,wbc);\n      const b=clamp(Math.round((ovr()-52)*0.35)+Math.round((teamStrength-5)*0.8),0,8);'
          if s.count(old)!=1: raise SystemExit('intl formula mismatch')
          s=s.replace(old,new,1)
          s=s.replace('隱藏稱號：Team Taiwan','隱藏稱號：武士精神')
          s=s.replace('永遠把國家榮耀放在比職涯更高的位子，台灣球迷的心中永遠有一幅畫：你在球場上向全場比劃著胸口，那是你心中最榮耀的地方。','永遠把日本代表的榮耀放在比個人職涯更高的位置。你在球場上拍著胸口、向看台致意的那一刻，成為球迷心中最驕傲的畫面。')
          intl.write_text(s,encoding='utf-8')

          traits=ROOT/'src/data/traits.js'; s=traits.read_text(encoding='utf-8')
          s=s.replace("samurai:'Team Taiwan'","samurai:'武士精神'")
          s=s.replace("samurai:'國際賽徵召超過 5 次的國家隊常客'","samurai:'國際賽徵召超過 5 次的日本代表常客'")
          traits.write_text(s,encoding='utf-8')

          # Perfect-stat secret module.
          (ROOT/'src/japan.js').write_text('''import {S} from './core/state.js?v=1.5.11';\nimport {TRAIT_KEYS} from './data/traits.js?v=1.5.11';\nimport {board, card} from './ui/dom.js?v=1.5.11';\n\nconst SECRET=['P','C','IF','OF','OF','IF','C','P'];\nlet seq=[]; let armed=false; let lockInstalled=false;\n\nfunction installAbilityLock(){\n  if(!S||lockInstalled)return;\n  lockInstalled=true; S.perfectLock=true;\n  Object.keys(S.ab||{}).forEach(k=>S.ab[k]=80);\n  Object.keys(S.pot||{}).forEach(k=>S.pot[k]=80);\n  S.carry={}; TRAIT_KEYS.pos.forEach(k=>{S.traits[k]=true;});\n  const guard=target=>new Proxy(target,{set(t,k,v){if(S.perfectLock&&Object.prototype.hasOwnProperty.call(t,k)){t[k]=80;return true;}t[k]=v;return true;}});\n  let abRef=guard(S.ab), potRef=guard(S.pot);\n  Object.defineProperty(S,'ab',{configurable:true,enumerable:true,get(){return abRef;},set(v){abRef=guard(v);}});\n  Object.defineProperty(S,'pot',{configurable:true,enumerable:true,get(){return potRef;},set(v){potRef=guard(v);}});\n  card('gold','隱藏彩蛋：侍魂開啟','你在角色創建時輸入了傳說中的守位密碼。<b class="hl">所有正面附加效果已解鎖，所有能力值與潛力上限永久鎖定 80。</b> 這一局，規則由你寫。');\n  board(0);\n}\n\ndocument.querySelectorAll('#seg-pos button').forEach(btn=>btn.addEventListener('click',()=>{\n  seq.push(btn.dataset.v); if(seq.length>SECRET.length)seq.shift();\n  if(seq.length===SECRET.length&&seq.every((v,i)=>v===SECRET[i])){seq=[];armed=true;window.alert('侍魂已覺醒：所有正面附加效果解鎖，能力永遠鎖定滿級。開始這段生涯後生效。');}\n}));\nconst start=document.getElementById('btn-start');\nif(start)start.addEventListener('click',()=>{if(!armed)return;const wait=()=>S?installAbilityLock():setTimeout(wait,0);wait();});\n\nfunction localizeJapanText(root){\n  if(!root||S?.org==='CPBL')return;\n  const r=[\n    ['中華隊徵召','日本代表徵召'],['中華隊','日本代表'],['台灣的轉播單位','日本の放送局'],['台灣時間','日本時間'],['台灣棒球','日本野球'],['台灣球迷','日本のファン'],['台灣的力量','日本の力'],\n    ['用中文寫的「謝謝」毛巾','「ありがとう」と書かれたタオル'],['用不太標準的中文問你「還會回來嗎」','「また日本に戻ってきますか」と日本語で尋ねられ'],\n    ['不動產營業員','不動産営業'],['板模工','建設現場の職人'],['早餐店','喫茶店'],['少棒隊員','少年野球の子どもたち'],['公司壘球隊','会社の草野球チーム'],['消防員','消防士'],['乙組業餘棒球隊','社会人クラブチーム'],['台北大巨蛋','東京ドーム'],['臺北大巨蛋','東京ドーム']\n  ];\n  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT), nodes=[]; while(w.nextNode())nodes.push(w.currentNode);\n  for(const n of nodes){let t=n.nodeValue;for(const [a,b] of r)t=t.split(a).join(b);if(t!==n.nodeValue)n.nodeValue=t;}\n}\nconst observer=new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)localizeJapanText(n);})));\nobserver.observe(document.body,{childList:true,subtree:true}); localizeJapanText(document.body);\n''',encoding='utf-8')

          # Load localization before the main module.
          idx=ROOT/'index.html'; s=idx.read_text(encoding='utf-8')
          marker='<script type="module" src="src/main.js?v=1.5.11-ui-complete"></script>'
          if s.count(marker)!=1: raise SystemExit('index marker mismatch')
          idx.write_text(s.replace(marker,'<script type="module" src="src/japan.js?v=1.5.11-jp"></script>\n'+marker,1),encoding='utf-8')

          # Core perfect lock: training/ability paths, decline and injury all respect it.
          ability=ROOT/'src/engine/ability.js'; s=ability.read_text(encoding='utf-8')
          s=s.replace('export function addAb(k,v){ if(!(k in S.ab))return 0;','export function addAb(k,v){ if(S.perfectLock){ if(k in S.ab)S.ab[k]=80; return 0; } if(!(k in S.ab))return 0;',1)
          s=s.replace('export function addAbStat(k,amt){\n  if(amt<=0)return addAb(k,amt);','export function addAbStat(k,amt){\n  if(S.perfectLock){ if(k in S.ab)S.ab[k]=80; return 0; }\n  if(amt<=0)return addAb(k,amt);',1)
          s=s.replace('export function normalizeAbCarry(k){\n  if(!S.carry)S.carry={};','export function normalizeAbCarry(k){\n  if(S.perfectLock){ if(k in S.ab)S.ab[k]=80; if(!S.carry)S.carry={}; S.carry[k]=0; return 0; }\n  if(!S.carry)S.carry={};',1)
          if 'export function enforcePerfectAbilities' not in s:
              s=s.replace('export function dpScore(p){','export function enforcePerfectAbilities(){\n  if(!S?.perfectLock)return;\n  Object.keys(S.ab||{}).forEach(k=>S.ab[k]=80);\n  Object.keys(S.pot||{}).forEach(k=>S.pot[k]=80);\n  S.carry={};\n}\nexport function dpScore(p){',1)
          ability.write_text(s,encoding='utf-8')

          phases=ROOT/'src/flow/phases.js'; s=phases.read_text(encoding='utf-8')
          s=s.replace("import {addAb, ovr, dposReview, statBonusTxt} from '../engine/ability.js?v=1.5.11';","import {addAb, ovr, dposReview, statBonusTxt, enforcePerfectAbilities} from '../engine/ability.js?v=1.5.11';",1)
          s=s.replace('export function startYear(){ S.yearOutsideIncome=0; stepQ.length=0;','export function startYear(){ S.yearOutsideIncome=0; enforcePerfectAbilities(); stepQ.length=0;',1)
          s=s.replace('  if(declAge>=32){','  if(!S.perfectLock&&declAge>=32){',1)
          phases.write_text(s,encoding='utf-8')

          injury=ROOT/'src/engine/injury.js'; s=injury.read_text(encoding='utf-8')
          s=s.replace('export function injuryProb(){ /* 基礎風險從 24 降為 15，減少動不動就受傷的頻率 */\n  let p=15+S.injNext;','export function injuryProb(){ /* 基礎風險從 24 降為 15，減少動不動就受傷的頻率 */\n  if(S.perfectLock)return 0;\n  let p=15+S.injNext;',1)
          injury.write_text(s,encoding='utf-8')

          # Regression coverage for the requested world/secret behavior.
          (ROOT/'tests/japan_world.mjs').write_text('''import assert from 'node:assert/strict';\nimport {chromium} from 'playwright';\nconst url=process.env.YAKYOLIFE_URL||'http://127.0.0.1:8124/';\nconst browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH||'C:\\\\Program Files\\\\Google\\\\Chrome\\\\Application\\chrome.exe',args:['--disable-gpu']});\ntry{\n  const page=await browser.newPage();\n  page.on('dialog',d=>d.accept());\n  await page.goto(`${url}?seed=japan-world`,{waitUntil:'domcontentloaded'});\n  const result=await page.evaluate(async()=>{\n    const state=await import('./src/core/state.js?v=1.5.11');\n    const traits=await import('./src/data/traits.js?v=1.5.11');\n    const economy=await import('./src/data/economy.js?v=1.5.11');\n    const intl=await import('./src/engine/intl.js?v=1.5.11');\n    const s=state.newState('侍魂測試',18,'P',null);\n    s.traits.taiwan=true; state.setS(s);\n    const migrated=!!s.traits.samurai&&!('taiwan' in s.traits);\n    for(const v of ['P','C','IF','OF','OF','IF','C','P'])document.querySelector(`#seg-pos button[data-v="${v}"]`).click();\n    document.querySelector('#btn-start').click();\n    await new Promise(r=>setTimeout(r,50));\n    const now=(await import('./src/core/state.js?v=1.5.11')).S;\n    return {migrated,samuraiLabel:traits.TRAIT_N.samurai,devSalary:economy.LEVEL_MIN_ANNUAL.NPB_TRAIN,wbc2009:intl.japanIntlStrength(2009,true),wbc2017:intl.japanIntlStrength(2017,true),wbc2026:intl.japanIntlStrength(2026,true),perfect:!!now.perfectLock,all80:Object.values(now.ab).every(v=>v===80),allPos:traits.TRAIT_KEYS.pos.every(k=>now.traits[k]===true)};\n  });\n  assert.equal(result.migrated,true); assert.equal(result.samuraiLabel,'武士精神'); assert.equal(result.devSalary,240);\n  assert.equal(result.wbc2009,8); assert.equal(result.wbc2017,5); assert.equal(result.wbc2026,7);\n  assert.equal(result.perfect,true); assert.equal(result.all80,true); assert.equal(result.allPos,true);\n  console.log(JSON.stringify(result,null,2));\n}finally{await browser.close();}\n''',encoding='utf-8')

          # Remove this one-shot workflow from the same commit. Strip only trailing whitespace from files touched here.
          for rel in ['src/engine/ability.js','src/engine/intl.js']:
              p=ROOT/rel; p.write_text('\n'.join(x.rstrip() for x in p.read_text(encoding='utf-8').splitlines())+'\n',encoding='utf-8')
          Path('.github/workflows/jp-world-localization.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src index.html tests/japan_world.mjs .github/workflows/jp-world-localization.yml
          git diff --cached --check
          git commit -m "feat: localize Japan world and add samurai secret"
          git push origin HEAD:main
