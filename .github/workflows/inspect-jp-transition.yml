name: Inspect JP transition
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect transition context
        shell: bash
        run: |
          echo '--- contract.js 515-695 ---'
          nl -ba src/engine/contract.js | sed -n '515,695p'
          echo '--- phases.js 90-125 ---'
          nl -ba src/flow/phases.js | sed -n '90,125p'
          echo '--- attribution/contact remnants ---'
          grep -Rni -E 'discord|贊助|sponsor|ko-fi|buymeacoffee|paypal' --exclude-dir=.git . | head -n 200 || true
