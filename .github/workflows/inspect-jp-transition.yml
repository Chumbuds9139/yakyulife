name: Inspect JP transition
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect transition references
        shell: bash
        run: |
          echo '--- direct NPB -> MLB / MiLB transition references ---'
          grep -Rni -E "NPB1.*MLB|MLB.*NPB1|S\\.lv.*MLB|S\\.lv.*NPB1|signTo\\('MiLB'.*MLB|signTo\\('MLB'" src --include='*.js' || true
          echo '--- promotion / level-change references ---'
          grep -Rni -E "S\\.lv=|S\\.org=|lv='MLB'|lv=\"MLB\"|org='MiLB'|org=\"MiLB\"" src --include='*.js' | head -n 250 || true
