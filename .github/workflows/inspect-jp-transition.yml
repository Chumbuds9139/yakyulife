name: Inspect JP transition
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect transition and attribution text
        shell: bash
        run: |
          echo '--- contract.js NPB/MLB lines ---'
          grep -n -E 'NPB|MLB|crossOffers|outOfOrg|pickOfferUI|signTo' src/engine/contract.js | tail -n 120 || true
          echo '--- phases.js NPB/MLB lines ---'
          grep -n -E 'NPB|MLB|中華職棒|旅日|Discord|贊助|sponsor' src/flow/phases.js | tail -n 120 || true
          echo '--- all attribution/contact remnants ---'
          grep -Rni -E 'discord|贊助|sponsor|ko-fi|buymeacoffee|paypal' --exclude-dir=.git . | head -n 200 || true
