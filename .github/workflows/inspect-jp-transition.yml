name: Inspect JP transition
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect remaining migration references
        shell: bash
        run: |
          echo '--- source URL/contact references ---'
          grep -Rni -E 'portaly|discord\\.gg|discord\\.com|SPONSOR_URL|OFFICIAL_URL|community|贊助支持|贊助|Discord' index.html src --include='*.html' --include='*.js' || true
          echo '--- all explicit CBL/旅日 labels in app ---'
          grep -Rni -E '中華職棒|中職選秀|洽談旅日|旅日合約|休學挑戰日職' index.html src --include='*.html' --include='*.js' || true
