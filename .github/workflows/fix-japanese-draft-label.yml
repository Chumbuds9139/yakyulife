name: Fix Japanese draft label
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace outdated draft label
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/flow/phases.js')
          s = p.read_text(encoding='utf-8')
          old = "{t:'投入中華職棒選秀',s:`目前綜合 ${o}｜年齡加權：越年輕評價越高`,f:()=>runDraft(true,finishDecision)}"
          new = "{t:'投入日本職棒選秀',s:`目前綜合 ${o}｜年齡加權：越年輕評價越高`,f:()=>runDraft(true,finishDecision)}"
          if old not in s:
              raise SystemExit('Target label not found; refusing to modify file.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/flow/phases.js
          git rm .github/workflows/fix-japanese-draft-label.yml
          git commit -m "Fix university draft label for Japan branch"
          git push
