name: Verify JP fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run regression tests
        run: |
          python3 -m http.server 8124 --bind 127.0.0.1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8124/ >/dev/null && break; sleep 0.5; done
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          fail=0
          for f in tests/*.mjs; do
            if node "$f" >/tmp/out.txt 2>&1; then echo "PASS $f"; else echo "FAIL $f"; cat /tmp/out.txt; fail=1; fi
          done
          exit $fail
      - name: Remove temporary verification workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'Chumbuds9139'
          git config user.email 'andycandy0429@gmail.com'
          git rm -f .github/workflows/verify-jp-fix.yml
          git commit -m 'chore: remove temporary JP verification workflow'
          git push origin main
