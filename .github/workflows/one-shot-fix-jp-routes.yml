name: One-shot JP route cleanup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: hashFiles('.github/one-shot-fix-jp-routes.py') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply route cleanup
        run: |
          python3 .github/one-shot-fix-jp-routes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/flow/phases.js
          git commit -m "fix: remove direct NPB contract from college route"
          git push origin HEAD:main
      - name: Remove one-shot files
        run: |
          git rm .github/one-shot-fix-jp-routes.py .github/workflows/one-shot-fix-jp-routes.yml
          git commit -m "chore: remove one-shot JP route cleanup"
          git push origin HEAD:main
