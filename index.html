<meta property="og:description" content="日本棒球人生模擬器：從高中、大學、社會人與獨立聯盟走向日本職棒、旅美與國際賽。">

<meta name="twitter:title" content="YaKyoLife - 日本棒球人生模擬器">
<meta name="twitter:description" content="日本棒球人生模擬器：從高中、大學、社會人與獨立聯盟走向日本職棒、旅美與國際賽。">
<meta name="twitter:image" content="https://chumbuds9139.github.io/yakyulife/og.png">
<link rel="icon" type="image/png" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/app-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=IBM+Plex+Mono:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">

<link rel="stylesheet" href="css/japan-ui-fixes.css?v=1.5.29">
</head>
<body>
<div id="start">
  <div class="wrap">
    <h1 id="logo-tap" class="lockup">
      <img class="wm-img" src="assets/yakyolife-logo.svg" alt="YaKyoLife" decoding="async">
      <span class="lockup-sub"><i></i><em>棒球人生模擬器</em><i></i></span>
    </h1>
    <p class="sub">高校養成 → 日本職棒選秀・旅美 → 國際賽 → 衰退與引退。每一顆骰子都算數。</p>
    <div class="start-sheet">
      <div class="start-form">
        <div class="field"><label for="in-name">球員資料</label>
          <div class="player-id-input">
            <input id="in-name" maxlength="10" placeholder="姓名" aria-label="球員姓名" autocomplete="off">
            <div class="jersey-input"><span aria-hidden="true">#</span><input id="in-number" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="背號" aria-label="背號" autocomplete="off"></div>
          </div>
        </div>
        <div class="field"><label>守位</label>
          <div class="seg" id="seg-pos">
            <button type="button" data-v="P" class="on">投手</button><button type="button" data-v="C">捕手</button>
            <button type="button" data-v="IF">內野手</button><button type="button" data-v="OF">外野手</button>
          </div>
        </div>
        <div class="field seedline"><label for="seed-show">世界種子</label>
          <div class="seed-input-row">
            <input id="seed-show" maxlength="24">
            <a href="#" id="seed-re"><i class="ph-bold ph-arrow-clockwise" aria-hidden="true"></i>換一個</a>
          </div>
          <p class="seed-hint">相同種子＋相同選擇＝相同人生（可直接輸入朋友的種子碼）</p>
        </div>
      </div>
      <details id="fld-display">
        <summary aria-controls="disp-body" aria-expanded="false"><i class="ph-fill ph-palette" aria-hidden="true"></i>顯示設定<span class="sum" id="disp-sum"></span></summary>
      </details>
      <div id="disp-body" class="start-preferences" hidden>
        <div class="field"><label>佈景主題</label>
          <div class="seg two" id="seg-theme">
            <button type="button" data-t="a" class="on">深綠記分板</button><button type="button" data-t="b">電子看板</button>
            <button type="button" data-t="c">報紙版面</button><button type="button" data-t="d">現代儀表板</button>
          </div></div>
        <div class="field" id="fld-big"><label>字級</label>
          <div class="seg two" id="seg-big">
            <button type="button" data-b="0" class="on">標準</button><button type="button" data-b="1">大字</button>
          </div></div>
        <div class="field" id="fld-ui"><label>介面版型</label>
          <div class="seg two" id="seg-ui">
            <button type="button" data-u="0" class="on">電腦版</button><button type="button" data-u="1">手機版</button>
          </div></div>
      </div>
    </div>
  </div>
  <footer id="start-footer">
    <button class="btn main" id="btn-start"><i class="ph-fill ph-play" aria-hidden="true"></i><span>開始生涯 ▸ 高一春天</span></button>
    <div class="start-meta"><span id="ver-badge">v1.5.29</span><a id="author-credit" href="https://github.com/LeoGGcat/yakyulife" target="_blank" rel="noopener noreferrer">原作者：最先生</a></div>
  </footer>
</div>
<div id="app">
  <aside id="tl-side"><div id="tl-in">
    <div class="tl-brand"><img class="wm-img" src="assets/yakyolife-logo.svg" alt="YaKyoLife"><span class="sub">棒球人生模擬器</span></div>
    <div id="tl-list"></div>
    <div class="tl-seed">SEED <b id="tl-seed"></b><span class="tl-ver" id="tl-ver"></span></div>
  </div></aside>
  <div id="mid">
    <header id="board" style="display:none">
      <div id="bd-top">
        <div id="bd-num"><span>NO.</span><b id="bd-jersey">0</b></div>
        <div id="bd-id"><div id="bd-name"></div><div id="bd-role"></div></div>
        <div id="bd-team"></div><span id="bd-tj"></span>
        <button id="btn-menu" title="選單" aria-label="選單"><i class="ph-bold ph-list" aria-hidden="true"></i></button>
      </div>
      <div id="bd-grid">
        <div class="bd-cell"><b id="bd-age">16</b><span>年齡</span></div>
        <div class="bd-cell"><b id="bd-year">2026</b><span>年份</span></div>
        <div class="bd-cell"><b id="bd-ovr">30</b><span>綜合</span></div>
        <div class="bd-cell" id="bd-sal-cell" tabindex="0"><b id="bd-sal">0</b><span id="bd-sal-lbl">生涯薪(萬)</span><i class="bd-tip" id="bd-sal-tip"></i></div>
        <button id="bd-more" aria-expanded="false" aria-controls="bd-detail" aria-label="詳情" title="詳情"><span class="lb">詳情</span><i class="ph-bold ph-caret-down chev"></i></button>
      </div>
      <div id="bd-detail" data-tab="h"></div>
      <div id="lamps">
        <span class="lamp" id="lp0"><i></i>季初</span>
        <span class="lamp" id="lp1"><i></i>賽季中</span>
        <span class="lamp" id="lp2"><i></i>季末</span>
      </div>
      <div id="bd-hint" aria-hidden="true"><i class="ph-bold ph-caret-down chev"></i></div>
      <div id="tl-strip"></div>
    </header>
    <main id="log"></main>
  </div>
  <aside id="act-side"><div id="act-in">
    <div id="trait-side"><div class="tt">特質</div><div id="trait-tags"></div></div>
    <button id="act-toggle" style="display:none"><i class="ph-bold ph-caret-down chev" aria-hidden="true"></i></button>
    <footer id="act" style="display:none"></footer>
  </div></aside>
  <footer id="game-footer" aria-label="YaKyoLife">
    <img class="wm-img" src="assets/yakyolife-logo.svg" alt="YaKyoLife" decoding="async">
    <span class="sub">棒球人生模擬器</span>
    <span class="ver" id="game-ver"></span>
  </footer>
</div>
<div id="modal"><div id="modal-box"></div></div>
<div id="alloc-full"><div id="af-inner"><div class="af-head"><span class="af-title" id="af-title"></span><button class="btn" id="af-close">收起</button></div><div id="af-body"></div></div></div>
<script type="module" src="src/japan.js?v=1.5.29"></script>
<script type="module" src="src/cpbl-recovery.js?v=1.5.29"></script>
<script type="module" src="src/main.js?v=1.5.29"></script>
</body>
</html>
